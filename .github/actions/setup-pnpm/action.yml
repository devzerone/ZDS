name: Setup PNPM Workspace
description: Checkout repository, set up pnpm and Node.js, and install workspace dependencies.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"
  pnpm-version:
    description: pnpm version
    required: false
    default: "10.30.3"
  registry-url:
    description: Optional npm registry URL for setup-node
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
