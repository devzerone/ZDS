name: Docs System Validation

on:
  push:
    branches: [master, main]
    paths:
      - "apps/docs/**"
      - "packages/react/**"
      - "packages/tokens/**"
      - "spec/**"
      - "testing/docs-system/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs-system-validation.yml"
      - ".github/workflows/reusable-pnpm-command.yml"
      - ".github/actions/setup-pnpm/**"
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/react/**"
      - "packages/tokens/**"
      - "spec/**"
      - "testing/docs-system/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs-system-validation.yml"
      - ".github/workflows/reusable-pnpm-command.yml"
      - ".github/actions/setup-pnpm/**"

concurrency:
  group: docs-system-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/reusable-pnpm-command.yml
    permissions:
      contents: read
    with:
      runner: ubuntu-latest
      command: pnpm validate:docs-system
