name: Publish JS Packages

on:
  push:
    tags:
      - "js-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to publish"
        required: true
        type: string

concurrency:
  group: publish-js-packages-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: "22"
          pnpm-version: "10.30.3"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#js-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set package versions
        run: |
          pnpm --filter @zds/tokens exec npm pkg set version=${{ steps.version.outputs.value }}
          pnpm --filter @zds/react exec npm pkg set version=${{ steps.version.outputs.value }}
          pnpm --filter @zds/foundation exec npm pkg set version=${{ steps.version.outputs.value }}

      - name: Validate publishable packages
        run: pnpm validate:publishable-js

      - name: Publish tokens
        run: pnpm --filter @zds/tokens publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish foundation
        run: pnpm --filter @zds/foundation publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish react
        run: pnpm --filter @zds/react publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
