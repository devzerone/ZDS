name: Release SwiftUI Package

on:
  push:
    tags:
      - "swiftui-v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-swiftui-package-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: "22"
          pnpm-version: "10.30.3"

      - name: Validate SwiftUI token consumption
        run: pnpm --filter @zds/swiftui validate:tokens-consumption

      - name: Validate SwiftUI package
        run: pnpm --filter @zds/swiftui build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
