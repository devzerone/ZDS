name: Release SwiftUI Package

on:
  push:
    tags:
      - "swiftui-v*.*.*"
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SwiftUI package
        working-directory: packages/swiftui
        run: swift build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
