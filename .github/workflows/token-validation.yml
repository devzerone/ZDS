name: Token Validation

on:
  pull_request:
    paths:
      - "packages/tokens/**"
      - "testing/tokens/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/token-validation.yml"
      - ".github/workflows/reusable-pnpm-command.yml"
      - ".github/actions/setup-pnpm/**"
  push:
    branches:
      - main
    paths:
      - "packages/tokens/**"
      - "testing/tokens/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/token-validation.yml"
      - ".github/workflows/reusable-pnpm-command.yml"
      - ".github/actions/setup-pnpm/**"

concurrency:
  group: token-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-tokens:
    uses: ./.github/workflows/reusable-pnpm-command.yml
    permissions:
      contents: read
    with:
      runner: ubuntu-latest
      command: pnpm validate:tokens
