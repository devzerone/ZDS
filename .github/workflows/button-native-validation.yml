name: Button Native Validation

on:
  push:
    branches:
      - main
      - master
      - 005-button-platform-parity
  pull_request:

jobs:
  validate-swiftui:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate SwiftUI button package
        working-directory: packages/swiftui
        run: swift build

  validate-kotlin:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Validate Kotlin button package
        run: gradle --no-daemon -p packages/kotlin build

  validate-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate WinUI 3 button package
        run: dotnet build packages/windows/ZDS.Windows.csproj
